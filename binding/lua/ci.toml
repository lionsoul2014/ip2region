toolchain = { name = "lua", version = "5.4" }
platforms = ["linux", "macos", "windows"]

[[lint]]
name = "Luacheck"
run = ["luacheck", "."]

[[test]]
name = "Run test_version_parse"
run = ["lua", "util_test.lua", "test_version_parse"]

[[test]]
name = "Run test_parse_ip"
run = ["lua", "util_test.lua", "test_parse_ip"]

[[test]]
name = "Run test_ip_compare"
run = ["lua", "util_test.lua", "test_ip_compare"]

[[test]]
name = "Run test_load_header"
run = ["lua", "util_test.lua", "test_load_header"]

[[test]]
name = "Run test_load_vector_index"
run = ["lua", "util_test.lua", "test_load_vector_index"]

[[test]]
name = "Run test_load_content"
run = ["lua", "util_test.lua", "test_load_content"]

[[test]]
name = "Run test_verify"
run = ["lua", "util_test.lua", "test_verify"]

[[test]]
name = "Run test_ip_search"
run = ["lua", "util_test.lua", "test_ip_search"]

[[accept]]
name = "Bench the IPv4 xdb against its source"
run = ["lua", "bench_test.lua", "--db=../../data/ip2region_v4.xdb", "--src=../../data/ipv4_source.txt"]
timeout = 1800

[[accept]]
name = "Bench the IPv6 xdb against its source"
run = ["lua", "bench_test.lua", "--db=../../data/ip2region_v6.xdb", "--src=../../data/ipv6_source.txt"]
timeout = 1800
